# Target B - INSECURE Apache settings (on purpose, for the lab)
# This file replaces Apache's default /etc/apache2/conf-available/security.conf

# Send the full version banner in the "Server" header,
# e.g. "Server: Apache/2.4.65 (Debian)"
ServerTokens Full

# Print the server version at the bottom of error pages and directory listings
ServerSignature On

# Allow the HTTP TRACE method (can help Cross-Site Tracing attacks)
TraceEnable On

# Website folder: "Indexes" turns ON directory listing
<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
