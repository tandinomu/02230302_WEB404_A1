; Target B - INSECURE PHP settings (on purpose, for the lab)

; Adds "X-Powered-By: PHP/8.x.x" to every response (leaks the PHP version)
expose_php = On

; Shows PHP errors (file paths, code details) to visitors
display_errors = On

; Session cookie WITHOUT protective flags:
; JavaScript can read it (no HttpOnly), it is sent over plain HTTP
; (no Secure), and it is sent on cross-site requests (no SameSite)
session.cookie_httponly = 0
session.cookie_secure = 0
session.cookie_samesite =
