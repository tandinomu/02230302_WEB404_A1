# Target C - HARDENED Apache settings
# This file replaces Apache's default /etc/apache2/conf-available/security.conf

# Only send "Server: Apache" - no version number, no OS
ServerTokens Prod

# Don't print the server version on error pages
ServerSignature Off

# Block the HTTP TRACE method
TraceEnable Off

# Website folder: "-Indexes" turns OFF directory listing
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Security headers (need mod_headers, enabled in the Dockerfile)
# "always" means the header is added to error pages too

# Stop other sites from putting our pages in a frame (clickjacking)
Header always set X-Frame-Options "DENY"

# Stop the browser from guessing (sniffing) file types
Header always set X-Content-Type-Options "nosniff"

# Only load scripts, styles, images etc. from our own site
Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"

# Don't send our full URLs to other sites in the Referer header
Header always set Referrer-Policy "strict-origin-when-cross-origin"
