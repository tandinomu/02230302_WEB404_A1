; Target C - HARDENED PHP settings

; Remove the "X-Powered-By" header (hide the PHP version)
expose_php = Off

; Don't show errors to visitors (log them instead)
display_errors = Off
log_errors = On

; Session cookie WITH protective flags:
; HttpOnly - JavaScript cannot read it (protects against cookie theft via XSS)
; Secure   - browser only sends it over HTTPS
; SameSite - browser doesn't send it on cross-site requests (helps against CSRF)
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
